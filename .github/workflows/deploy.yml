name: Deploy to Cloudflare Workers

# Cloudflare's dashboard Git integration only deploys when manually
# triggered from the dashboard — it doesn't auto-deploy on push. This
# workflow is what actually wires "push to main" to "site updates".
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
