<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://bart.xcet.uk" />
  <title>Asset Information Lookup System — Moved to BART</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #14213d;
      text-align: center;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1622; color: #e7ecf3; }
    }
    .card { max-width: 420px; }
    .card img { width: 64px; height: 64px; margin-bottom: 16px; }
    .card h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .card p { margin: 0 0 24px; opacity: 0.75; line-height: 1.5; }
    .button {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 8px;
      background: #14213d;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      .button { background: #4f7cff; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/icons/icon-192.png" width="64" height="64" alt="" />
    <h1>This tool has moved</h1>
    <p>Asset Information Lookup is now part of BART. You should be redirected automatically — if not, use the link below.</p>
    <a class="button" href="https://bart.xcet.uk">Go to BART&nbsp;→</a>
  </div>
  <script>
    location.replace('https://bart.xcet.uk');
  </script>
</body>
</html>
